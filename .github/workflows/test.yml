name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install Chromium
        run: sudo apt-get install -y chromium-browser
      - name: Run tests
        env:
          OPFS_E2E: "1"
        run: go test -v -timeout 300s ./...
